<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Dark Ink Background with Brass Border -->
  <rect width="64" height="64" rx="14" fill="#0D0F12"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#C4A47C" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Outer Surveyor Compass Ring -->
  <circle cx="32" cy="32" r="22" stroke="#C4A47C" stroke-width="1.5" stroke-dasharray="2 3" stroke-opacity="0.6"/>
  
  <!-- Cardinal Points (N/S/E/W ticks) -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#C4A47C" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#C4A47C" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#C4A47C" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="#C4A47C" stroke-width="2" stroke-linecap="round"/>

  <!-- Brass Compass Diamond Pointer (Vertical North/South) -->
  <polygon points="32,10 38,32 32,54 26,32" fill="#C4A47C"/>
  <polygon points="32,10 38,32 32,32" fill="#E5C9A3"/> <!-- Light Highlight Face -->

  <!-- Horizontal East/West Pointer -->
  <polygon points="10,32 32,26 54,32 32,38" fill="#A8875B"/>
  <polygon points="10,32 32,26 32,32" fill="#C4A47C"/> <!-- Light Highlight Face -->

  <!-- Center Pivot Core (Moss Green Accent) -->
  <circle cx="32" cy="32" r="4.5" fill="#0D0F12" stroke="#8BA888" stroke-width="2"/>
  <circle cx="32" cy="32" r="2" fill="#8BA888"/>
</svg>